name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parse:
    name: Parse all PowerShell modules
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse .ps1 files (syntax gate)
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $script:failed = $true
              Write-Host "::error file=$($_.Name):: $($_.Name) has $($errors.Count) parse error(s):"
              $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "OK $($_.Name)"
            }
          }
          if ($failed) { exit 1 }
